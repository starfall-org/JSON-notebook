name: json_notebook
description: Native Flutter JSON vault backed by Google Drive.
publish_to: none
version: 1.0.7+13
environment:
  sdk: ^3.13.0
dependencies:
  flutter:
    sdk: flutter
  google_identity_services_web: ^0.3.3+1
  google_sign_in: ^6.2.2
  http: ^1.4.0
  shared_preferences: ^2.5.3
  url_launcher: ^6.3.2
  web: ^1.1.1
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/json-notebook.png
    - assets/fonts/JetBrainsMono-OFL.txt
  fonts:
    - family: JetBrains Mono NL
      fonts:
        - asset: assets/fonts/JetBrainsMonoNL-Regular.ttf
